<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <main class="container">

        <h1>Lab 6</h1>
        <h2>Like or Dislike</h2>

        <div class="vote-buttons">

            <button id="like-btn">👍 <span id="like-count">100</span> </button>
            <button id="dislike-btn">👎 <span id="dislike-count">20</span> </button>

        </div>

        <h2>Comments</h2>
        <textarea id="comment-input" placeholder="Write a comment..." rows="6"></textarea>

        <div class="comment-buttons">
            <button id="submit-btn">Submit</button>
            <button id="reset-btn">Reset</button>

        </div>

        <div id="comments-section"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
